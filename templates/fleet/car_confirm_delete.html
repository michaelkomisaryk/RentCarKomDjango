{% extends "base.html" %}

{% block title %}Delete {{ car.brand }} {{ car.model }} · rentCarKom{% endblock %}

{% block content %}
  <h1>Delete car?</h1>
  <p>Delete {{ car.brand }} {{ car.model }}? This cannot be undone.</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <a class="button secondary" href="{% url 'car_detail' car.pk %}">Cancel</a>
    <button class="button danger" type="submit">Delete</button>
  </form>
{% endblock %}
